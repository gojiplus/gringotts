[build-system]
requires = ["hatchling>=1.31.0", "uv-dynamic-versioning"]
build-backend = "hatchling.build"

[project]
name = "gringotts-api"
description = "Prepaid credits for your FastAPI, with your own Stripe account, in 5 minutes."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Gaurav Sood", email = "gsood07@gmail.com" }]
requires-python = ">=3.11"
keywords = [
  "fastapi",
  "stripe",
  "api-monetization",
  "credits",
  "metering",
  "billing",
  "http-402",
]
classifiers = [
  "Development Status :: 4 - Beta",
  "Framework :: FastAPI",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3",
]
dependencies = [
  "fastapi>=0.110",
  "sqlalchemy>=2.0",
  "stripe>=10.0",
  "python-multipart>=0.0.9",
]
dynamic = ["version"]

[project.urls]
Homepage = "https://github.com/gojiplus/gringotts"
Documentation = "https://gojiplus.github.io/gringotts/"
Repository = "https://github.com/gojiplus/gringotts"
"Bug Tracker" = "https://github.com/gojiplus/gringotts/issues"

[project.scripts]
gringotts = "gringotts.cli:main"

[dependency-groups]
dev = [
  "ruff>=0.14",
  "pyright>=1.1.390",
  "pydoclint>=0.5",
  "pre-commit>=4",
  "uvicorn>=0.30",
  { include-group = "test" },
]
test = [
  "pytest>=8",
  "pytest-cov>=6",
  "httpx>=0.27",
  "psycopg2-binary>=2.9; sys_platform != 'win32'",
]
docs = [
  "sphinx>=8",
  "furo",
  "myst-parser",
  "sphinx-copybutton",
  "py-canon @ git+https://github.com/gojiplus/py-canon@v1",
]

[tool.hatch.build.targets.wheel]
packages = ["src/gringotts"]

[tool.hatch.version]
source = "uv-dynamic-versioning"

[tool.uv-dynamic-versioning]
vcs = "git"
style = "pep440"

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
external = ["DOC"]
select = ["E", "W", "F", "I", "B", "C4", "UP", "N", "D", "S", "SIM", "T20", "PT", "RUF"]
ignore = ["D203", "D213"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = [
  "fastapi.Depends",
  "fastapi.Form",
  "Depends",
  "Form",
  "charge",
  "gringotts.charge",
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S106", "D"]
"docs/**" = ["D"]
"examples/**" = ["T20", "D", "S311"]
"src/gringotts/cli.py" = ["T20"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.coverage.run]
source = ["src"]

[tool.pyright]
include = ["src"]
typeCheckingMode = "standard"

[tool.preen]
# pepy.tech does not index a package until it has download history, so the
# Downloads badge 404s for about a day after a first publish. Everything else
# the links check covers now resolves; drop this once pepy picks the package up.
skip_checks = ["links"]

[tool.pydoclint]
style = "google"
arg-type-hints-in-docstring = false
check-return-types = false
check-class-attributes = false
allow-init-docstring = true
exclude = '\.venv|tests|docs'
